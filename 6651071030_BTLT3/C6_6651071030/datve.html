<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt vé máy bay VietAir</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="card">
            <div class="logo">
                <h1>Viet<span>Air</span></h1>
            </div>
            
            <h2>Đặt vé máy bay VietAir - Kết quả Bài tập</h2>

            <form action="xu_ly_ve.php" method="POST" id="formDatVe">
                
                <strong>1. Thông tin chuyến bay</strong>
                <div class="row">
                    <div class="col">
                        <label for="diem_di">Điểm đi:</label>
                        <input type="text" name="diem_di" id="diem_di" list="danhsach_thanh_pho" placeholder="Nhập điểm đi">
                    </div>
                    <div class="col">
                        <label for="diem_den">Điểm đến:</label>
                        <input type="text" name="diem_den" id="diem_den" list="danhsach_thanh_pho" placeholder="Nhập điểm đến">
                    </div>
                </div>

                <datalist id="danhsach_thanh_pho">
                    <option value="Hà Nội – HAN">
                    <option value="TP. Hồ Chí Minh – SGN">
                    <option value="Đà Nẵng – DAD">
                    <option value="Nha Trang – CXR">
                    <option value="Phú Quốc – PQC">
                    <option value="Hải Phòng – HPH">
                    <option value="Cần Thơ – VCA">
                </datalist>

                <div class="row">
                    <div class="col">
                        <label for="ngay_di">Ngày đi:</label>
                        <input type="date" name="ngay_di" id="ngay_di" required>
                    </div>
                    <div class="col">
                        <label for="ngay_ve">Ngày về:</label>
                        <input type="date" name="ngay_ve" id="ngay_ve">
                    </div>
                    <div class="col">
                        <label for="hang_ghe">Hạng ghế:</label>
                        <select name="hang_ghe" id="hang_ghe" onchange="tinhTongTien()">
                            <optgroup label="Phổ thông">
                                <option value="eco_basic">Phổ thông cơ bản – 1.200.000đ</option>
                                <option value="eco_flex">Phổ thông linh hoạt – 1.800.000đ</option>
                            </optgroup>
                            <optgroup label="Thương gia">
                                <option value="biz">Thương gia – 4.500.000đ</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <strong>2. Thông tin hành khách</strong>
                <div class="row">
                    <div class="col">
                        <label for="nguoi_lon">Số hành khách người lớn:</label>
                        <input type="number" name="nguoi_lon" id="nguoi_lon" min="1" max="9" value="1" oninput="tinhTongTien()">
                    </div>
                    <div class="col">
                        <label for="tre_em">Số trẻ em:</label>
                        <input type="number" name="tre_em" id="tre_em" min="0" max="9" value="0" oninput="tinhTongTien()">
                    </div>
                    <div class="col">
                        <label for="ma_giam">Mã giảm giá:</label>
                        <input type="text" name="ma_giam" id="ma_giam" placeholder="Nhập mã nếu có" list="ma_uu_dai">
                        <datalist id="ma_uu_dai">
                            <option value="SUMMER20">
                            <option value="NEWMEMBER">
                            <option value="HOLIDAY50">
                        </datalist>
                    </div>
                </div>

                <strong>3. Kết quả ước tính</strong>
                <div class="result-box">
                    <label for="tong_tien">Tổng tiền ước tính:</label>
                    <output name="tong_tien" id="tong_tien" for="hang_ghe nguoi_lon tre_em">1.200.000 VNĐ</output>
                </div>

                <strong>4. Bảo mật giao dịch</strong>
                <div class="security-box">
                    <keygen name="security_key" keytype="rsa">
                    <p>🔒 Hệ thống sẽ tạo một cặp khóa mã hóa để bảo vệ thông tin của bạn.</p>
                </div>

                <div class="submit-box">
                    <button type="submit">✈ Tìm chuyến bay</button>
                </div>

            </form>
        </section>
    </main>

    <script>
        function tinhTongTien() {
            const giaGhe = {
                'eco_basic': 1200000,
                'eco_flex': 1800000,
                'biz': 4500000
            };

            const hangGhe = document.getElementById('hang_ghe').value;
            const nguoiLon = parseInt(document.getElementById('nguoi_lon').value) || 0;
            const treEm = parseInt(document.getElementById('tre_em').value) || 0;

            const donGia = giaGhe[hangGhe] || 0;
            const tong = (nguoiLon * donGia) + (treEm * donGia * 0.75);

            document.getElementById('tong_tien').value = tong.toLocaleString('vi-VN') + ' VNĐ';
        }
    </script>
</body>
</html>
